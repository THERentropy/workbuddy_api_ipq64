name: build-ipq64

on:
  push:
    branches: [main, master]
    tags: ["v*"]        # 打 tag 才发布 Release，别漏
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游 workbuddy2api 的分支 / tag / commit"
        required: false
        default: "master"
      pack:
        description: "二进制处理方式：upx=体积小（默认，真机已验证）| gzip=回退，运行时解压到内存盘"
        required: false
        default: "upx"

permissions:
  contents: write

jobs:
  lint:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shell 语法检查（busybox ash 兼容）
        run: |
          set -e
          for f in workbuddy/scripts-ipq64/*.sh workbuddy/install.sh workbuddy/uninstall.sh build_ipq64.sh; do
            [ -f "$f" ] || continue
            echo "check $f"
            sh -n "$f"
          done

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'

      - name: guard 静态检查
        run: |
          cd guard
          go vet ./...
          go build -o /tmp/wb2api-ctl .

  build:
    name: 交叉编译并打包
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'

      - name: 检出上游 workbuddy2api
        uses: actions/checkout@v4
        with:
          repository: Sliverkiss/workbuddy2api
          ref: ${{ github.event.inputs.upstream_ref || 'master' }}
          path: _upstream

      - name: 记录上游版本
        run: |
          cd _upstream
          echo "UPSTREAM_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "UPSTREAM_DATE=$(git log -1 --format=%cd --date=short)" >> $GITHUB_ENV

      - name: 编译上游二进制（linux/arm64 静态）
        run: |
          set -e
          mkdir -p workbuddy/bin_64
          cd _upstream
          export GOOS=linux GOARCH=arm64 CGO_ENABLED=0
          # 只编三个：server（网关）、login（OAuth）、signin（手动签到）
          # credit（积分日报）未被插件页面使用，为省 jffs 空间不打包
          go build -trimpath -ldflags="-s -w" -o ../workbuddy/bin_64/wb2api       ./cmd/server
          go build -trimpath -ldflags="-s -w" -o ../workbuddy/bin_64/wb2api-login ./cmd/login
          go build -trimpath -ldflags="-s -w" -o ../workbuddy/bin_64/wb2api-signin ./cmd/signin

      - name: 编译自研控制二进制 wb2api-ctl
        run: |
          set -e
          cd guard
          export GOOS=linux GOARCH=arm64 CGO_ENABLED=0
          # 版本号从 workbuddy/version 注入，避免和插件版本对不上
          go build -trimpath -ldflags="-s -w -X main.version=$(cat ../workbuddy/version)" \
            -o ../workbuddy/bin_64/wb2api-ctl .

      - name: 留存未压缩副本（排障时可单独下载验证，不进安装包）
        run: |
          mkdir -p dist
          cp -f workbuddy/bin_64/* dist/

      # ⚠️ UPX 版本必须钉死 4.2.4，不要随手升级：
      #   4.2.2 对 aarch64 静态二进制有 SIGILL 缺陷（https://github.com/upx/upx/issues/758），
      #   4.2.4 已在 TUF_6500（ARMv8 rev4 / aarch64 / kernel 5.4.277）真机验证通过：
      #   30 次连续执行 0 异常、serve 长驻与信号退出正常、UPX(ctl)+UPX(login) 走真实 TLS 成功。
      - name: 安装 UPX 4.2.4
        if: ${{ github.event.inputs.pack != 'gzip' }}
        run: |
          set -e
          curl -fsSL -o /tmp/upx.tar.xz \
            https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
          tar -xJf /tmp/upx.tar.xz -C /tmp
          echo "/tmp/upx-4.2.4-amd64_linux" >> $GITHUB_PATH

      - name: UPX 压缩（默认方案）
        if: ${{ github.event.inputs.pack != 'gzip' }}
        run: |
          set -e
          upx --best --lzma workbuddy/bin_64/*
          echo "=== 常驻 jffs 的体积 ==="
          du -sh workbuddy/bin_64
          ls -lh workbuddy/bin_64

      # 回退方案：GITHUB 手动触发时把 pack 填 gzip。
      # 二进制以 .gz 常驻 jffs，首次使用时解压到 /tmp（内存盘）运行。
      - name: gzip 压缩存放（回退方案）
        if: ${{ github.event.inputs.pack == 'gzip' }}
        run: |
          set -e
          cd workbuddy/bin_64
          for f in *; do
            # -n：不写入文件名与时间戳，保证同样源码产出同样的包（md5 可复现）
            gzip -9 -n -c "$f" > "$f.gz"
            rm -f "$f"
          done
          echo "=== 常驻 jffs 的体积 ==="
          du -sh .
          ls -lh

      - name: 打包离线安装包
        run: |
          set -e
          chmod +x build_ipq64.sh
          ./build_ipq64.sh
          echo "=== 安装包 ==="
          ls -lh workbuddy.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: workbuddy-ipq64
          path: |
            workbuddy.tar.gz
            version
            config.json.js

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workbuddy.tar.gz
            version
            config.json.js
            dist/*
          body: |
            上游 workbuddy2api: ${{ env.UPSTREAM_SHA }} (${{ env.UPSTREAM_DATE }})
            平台: koolshare ipq64 软件中心 (aarch64)
            打包方式: ${{ github.event.inputs.pack || 'upx' }}
            说明: UPX 4.2.4 已在该机型（TUF_6500 / ARMv8 / aarch64）真机验证；
                  如需保守方案，可在 Actions 手动触发时把 pack 填 gzip。
            dist/ 下是未压缩原始二进制，仅供排障时单独下载验证，不进安装包。
